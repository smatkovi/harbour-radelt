Name: harbour-radelt
Summary: Kilometres for Österreich radelt
Version: 0.7.0
Release: 1
Group: Qt/Qt
URL: https://github.com/smatkovi/harbour-radelt
License: GPLv3
Sources:
- '%{name}-%{version}.tar.bz2'
Description: |-
  Records bicycle rides with the satellite receiver, keeps them on the phone
  as GPX, and sends the kilometres to the Österreich radelt platform. Rides
  can also be typed in by hand.
Configure: none
Builder: qmake5

PkgConfigBR:
- sailfishapp >= 1.0.2
- Qt5Core
- Qt5Qml
- Qt5Quick
- Qt5Positioning
- Qt5Network

Requires:
- sailfishsilica-qt5 >= 0.10.9
- qt5-qtdeclarative-import-positioning
- libkeepalive >= 1.8

Files:
- '%{_bindir}'
- '%{_datadir}/%{name}'
- '%{_datadir}/applications/%{name}.desktop'
- '%{_datadir}/icons/hicolor/*/apps/%{name}.png'
