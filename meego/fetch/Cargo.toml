[package]
name = "radelt-fetch"
version = "0.1.0"
edition = "2021"
description = "One HTTPS request for the MeeGo edition of Radelt"
license = "GPL-3.0-or-later"

[dependencies]
# Why this helper exists: Harmattan's Qt 4 sits on an OpenSSL from 2011 and
# cannot complete a handshake with dashboard.radelt.at. rustls speaks TLS 1.2
# and 1.3 itself and webpki-roots brings the roots along -- the device's own
# certificate store is just as old as its OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "gzip", "cookies"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
